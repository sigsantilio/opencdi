[package]
name = "opencdi"
version = "0.1.8"
edition = "2024"

[features]
default = ["host"]
host = ["dep:winit", "dep:softbuffer", "dep:cpal", "dep:gilrs", "dep:env_logger", "dep:png"]

[workspace]

[[bin]]
name = "opencdi"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "debug_games"
path = "src/bin/debug_games.rs"
required-features = ["host"]

[[bin]]
name = "test_audio_trace"
path = "src/bin/test_audio_trace.rs"
required-features = ["host"]

[[bin]]
name = "test_dvc"
path = "src/bin/test_dvc.rs"
required-features = ["host"]

[[bin]]
name = "test_vcd"
path = "src/bin/test_vcd.rs"
required-features = ["host"]

[[bin]]
name = "test_boot_disc"
path = "src/bin/test_boot_disc.rs"
required-features = ["host"]

[dependencies]
byteorder = "1.5.0"
chd = "0.3.4"
cpal = { version = "0.18.2", optional = true }
env_logger = { version = "0.11.11", optional = true }
gilrs = { version = "0.11.2", optional = true }
log = "0.4.34"
m68k = "0.12.1"
oxideav-mp2 = "0.0.10"
png = { version = "0.18", optional = true }
softbuffer = { version = "0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", optional = true }

[patch.crates-io]
m68k = { path = "crates/m68k" }

[build-dependencies]
winres = "0.1.12"
